services:
  mc:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      VERSION: "1.21.10"
      EULA: "TRUE"
      SERVER_NAME: "HIJUEPAPUSVER"
      DIFFICULTY: "HARD"
      ONLINE_MOD: "FALSE"
    volumes:
      - ./data:/data
